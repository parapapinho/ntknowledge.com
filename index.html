<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NT Knowledge — Blog</title>
  <meta name="description" content="Artigos e anotações sobre Windows, engenharia reversa e pesquisa em segurança." />
  <script>
    try {
      const theme = localStorage.getItem('tema');
      document.documentElement.classList.toggle('dark', theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches));
    } catch (_) { document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches); }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <div class="app">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="topbar__brand" href="#/" aria-label="NT Knowledge — início">
          <span class="logo__mark" aria-hidden="true">&gt;</span>
          <span id="brandTitle">ntknowledge</span>
          <span class="logo__cursor" aria-hidden="true"></span>
        </a>
        <nav class="topbar__nav" aria-label="Navegação principal">
          <a href="#/blog" data-nav="blog">Blog</a>
          <a href="#/contact" data-nav="contact">Contact</a>
          <a href="#/cv" data-nav="cv">CV</a>
          <button id="themeToggle" class="iconbtn" aria-label="Alternar modo claro/escuro" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 010 16z" fill="currentColor" stroke="none"/></svg>
          </button>
        </nav>
      </div>
    </header>
    <main class="main" id="main" tabindex="-1">
      <div class="reader">
        <article class="content" id="content" aria-busy="true"><p class="state" role="status">Carregando…</p></article>
      </div>
    </main>
    <footer class="footer"><span>NT Knowledge</span><span><a href="LICENSE">CC0 1.0</a></span><span><a href="https://github.com/parapapinho/ntknowledge.com">Código no GitHub</a></span></footer>
  </div>
  <noscript><p class="state">Ative o JavaScript para navegar pelo blog. Você também pode acessar o <a href="https://github.com/parapapinho/ntknowledge.com">GitHub</a>.</p></noscript>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <script src="site-config.js"></script>
  <script src="site.js"></script>
</body>
</html>
